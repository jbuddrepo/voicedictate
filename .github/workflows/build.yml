name: Build and release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["package.json"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target; src-tauri/worker -> target-baseline; src-tauri/worker -> target-avx2" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install libclang runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/libclang | Out-Null
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/libclang.runtime.win-x64/21.1.8/libclang.runtime.win-x64.21.1.8.nupkg -OutFile work/libclang.nupkg
          tar -xf work/libclang.nupkg -C work/libclang
      - run: ./scripts/fetch-models.ps1
        shell: pwsh
      - name: Build and test
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          ./scripts/build.ps1 -Configuration Release
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/worker/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceDictate-Windows-x64
          path: artifacts/*
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version-beta.1" }
          $files = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          gh release create $tag @files --target $env:GITHUB_SHA --prerelease --title "VoiceDictate $version beta" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
